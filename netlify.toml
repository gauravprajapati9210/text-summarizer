[build]
  command = "node scripts/build-frontend-config.mjs"
  publish = "frontend"

[build.environment]
  API_BASE_URL = "https://text-summarizer-api-2ax4.onrender.com"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
