services:
  - type: web
    name: text-summarizer-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: HF_MODEL_ID
        value: facebook/bart-large-cnn
      - key: LIGHTWEIGHT_MODE
        value: "1"
